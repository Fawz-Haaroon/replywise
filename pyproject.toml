[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "replywise"
version = "0.1.0"
description = "Local-first, human-in-the-loop email drafting assistant"
requires-python = ">=3.11,<3.12"
dependencies = [
  "streamlit>=1.40,<2",
  "requests>=2.31,<3",
  "python-dotenv>=1.0,<2",
]

[tool.setuptools]
py-modules = ["app", "config", "domain_types"]

[tool.setuptools.packages.find]
include = ["domain*", "llm*", "responsible_ai*", "ui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
  "slow: provider calls or network-dependent tests",
]